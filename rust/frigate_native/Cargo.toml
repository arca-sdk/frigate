[package]
name = "frigate_native"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust implementations of Frigate's per-frame hot paths"
license = "MIT"

[lib]
name = "frigate_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.3", features = ["abi3-py311"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
